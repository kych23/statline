[project]
name = "statline"
version = "0.1.0"
description = "Fantasy football projections and league context for AI chatbot via MCP"
readme = "README.md"
authors = [{ name = "Kyle Chu", email = "kyleghchu@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest", "ruff", "pyright"]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
