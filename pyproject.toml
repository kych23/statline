[project]
name = "statline"
version = "0.1.0"
description = "Fantasy football projections and league context for AI chatbot via MCP"
readme = "README.md"
authors = [{ name = "Kyle Chu", email = "kyleghchu@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastmcp>=4,<5",
    "lightgbm>=4.7.0",
    "nflreadpy>=0.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "pandas-stubs>=3.1.0.261029",
    "tabulate>=0.10.0",
    "types-pyyaml>=6.0.12.20261103",
    "types-requests>=2.33.0.20261030",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["statline"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
